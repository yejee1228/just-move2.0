# main에 올릴 때마다 웹으로 빌드해서 GitHub Pages에 배포한다.
# 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions"로 바꿔야 동작한다.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build web
        # Pages 주소가 https://아이디.github.io/저장소이름/ 이므로 기준 경로를 저장소 이름으로 맞춘다
        # 실패하면 로그 끝부분을 알림(annotation)으로 남긴다 (로그인 없이도 실행 요약에서 보임)
        run: |
          set -o pipefail
          if ! npx expo export --platform web 2>&1 | tee build.log; then
            echo "::error title=expo export 실패::$(tail -n 40 build.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
        env:
          WEB_BASE_PATH: /${{ github.event.repository.name }}
          CI: 1

      - name: SPA fallback
        # 새로고침하거나 /records 같은 주소로 바로 들어와도 앱이 열리게 한다
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
